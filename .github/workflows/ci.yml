name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Every optional oracle extra except skyfield/inpop -- those two
      # need a >100 MB reference kernel that is deliberately never
      # committed to this repo (data/kernel-manifest.json documents the
      # hash any real one must match). Their own tests are written to
      # skip cleanly when the kernel file isn't present, exercising the
      # comparator/adapter logic that doesn't need it; the weekly Full
      # Validation workflow is what actually fetches the kernels and runs
      # those tests for real.
      - run: pip install -e ".[dev,swisseph,jyotishganit,pyjhora,astronomy-engine]"
      - run: pytest -q
      - run: ruff check .
